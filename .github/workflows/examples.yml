name: Examples

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to notice when a new Node.js release changes the results.
    - cron: '0 6 * * 1'

jobs:
  examples:
    name: ./run.sh with ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - name: Run the examples
        env:
          CONTAINER_ENGINE: ${{ matrix.engine }}
        # "shell: bash" adds pipefail, so a failure isn't hidden by tee.
        shell: bash
        run: ./run.sh -v | tee output.txt
      - name: Add the output to the job summary
        if: always()
        run: |
          {
            echo '```'
            sed 's/ *$//' output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
