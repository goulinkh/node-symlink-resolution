name: Examples

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to notice when a new Node.js release changes the results.
    - cron: '0 6 * * 1'

jobs:
  examples:
    name: ./run.sh ${{ matrix.runtimes }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # nodejs.org-20 has the same Node.js version as debian-13.
        runtimes: ['nodejs.org debian-13', 'nodejs.org-20 debian-13']
    steps:
      - uses: actions/checkout@v4
      - name: Run the examples
        # "shell: bash" adds pipefail, so a failure isn't hidden by tee.
        shell: bash
        run: ./run.sh -v ${{ matrix.runtimes }} | tee output.txt
      - name: Add the output to the job summary
        if: always()
        run: |
          {
            echo '```'
            sed 's/ *$//' output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
