name: Examples

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to notice when a new Node.js release changes the results.
    - cron: '0 6 * * 1'

jobs:
  examples:
    name: ./run.sh on ${{ matrix.system }}
    runs-on: ubuntu-latest
    container: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        system: ['debian:13', 'ubuntu:24.04', 'ubuntu:26.04']
    steps:
      - name: Install the nodejs package
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs ca-certificates curl xz-utils
      - uses: actions/checkout@v4
      - name: Run the examples
        # "shell: bash" adds pipefail, so a failure isn't hidden by tee.
        shell: bash
        run: ./run.sh -v | tee output.txt
      - name: Add the output to the job summary
        if: always()
        run: |
          {
            echo '```'
            sed 's/ *$//' output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
